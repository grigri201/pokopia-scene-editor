name = "pokopia-scene-editor"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

# Production deployment is static-only through Cloudflare Pages.
# Keep this Worker config for local API/MCP development; do not use it to publish API/MCP routes.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/v1", "/api/v1/*"]
