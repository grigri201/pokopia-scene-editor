<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokopia Scene Editor · Open Design UI</title>
  <style>
    :root {
      --bg: #d9b8bf;
      --bg-ink: #231f1a;
      --paper: #fbf7ee;
      --paper-2: #f2eadc;
      --ink: #231f1a;
      --muted: #71685f;
      --line: #d8cab8;
      --line-strong: #9f8e7b;
      --accent: #c85f56;
      --accent-soft: rgba(200, 95, 86, .16);
      --focus: #4169e1;
      --main-area: #fff8df;
      --outer-area: #dfeee8;
      --layer: #3d7a62;
      --skill: #355ec9;
      --warn: #b97824;
      --error: #b23a48;
      --shadow: 0 18px 52px rgba(35, 31, 26, .18);
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)),
        radial-gradient(circle at 20% 12%, rgba(255,255,255,.32), transparent 32%),
        var(--bg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.38;
      transition: background-color .18s ease;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(65, 105, 225, .36);
      outline-offset: 2px;
    }

    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 500;
      line-height: 1.05;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .app {
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      min-height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border: 1px solid rgba(35, 31, 26, .24);
      border-radius: 8px;
      background: rgba(251, 247, 238, .9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      font-size: 18px;
    }

    .brand-copy {
      display: grid;
      min-width: 0;
      gap: 1px;
    }

    .brand-copy strong {
      overflow: hidden;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy span {
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tools, .save-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .save-row { justify-content: flex-end; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.42);
      white-space: nowrap;
    }

    .chip.is-warn {
      border-color: rgba(185, 120, 36, .48);
      background: rgba(185, 120, 36, .12);
      color: #5f3b0d;
    }

    .tool,
    .primary-action,
    .secondary-action {
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,.38);
    }

    .tool svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool.is-on {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .tool.is-danger {
      border-color: rgba(204, 80, 73, .78);
      background: rgba(204, 80, 73, .12);
      color: #b83832;
    }

    .primary-action,
    .secondary-action {
      grid-auto-flow: column;
      gap: 7px;
      min-width: auto;
      padding: 0 12px;
      font-weight: 700;
    }

    .primary-action {
      border-color: var(--accent);
      background: var(--accent);
      color: #fffdf8;
    }

    .secondary-action {
      border-color: var(--line-strong);
      background: rgba(255,255,255,.5);
    }

    .workspace {
      position: relative;
      display: grid;
      grid-template-columns: minmax(680px, 1fr);
      gap: 10px;
      min-height: 0;
    }

    .panel, .stage {
      min-width: 0;
      min-height: 0;
      border: 1px solid rgba(35, 31, 26, .24);
      border-radius: 8px;
      background: rgba(251, 247, 238, .92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .panel-header {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(242, 234, 220, .72);
    }

    .panel-header h2, .section-title h3 {
      font-size: 18px;
    }

    .search {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: rgba(255,255,255,.56);
      overflow: hidden;
    }

    .search input {
      min-width: 0;
      height: 100%;
      border: 0;
      background: transparent;
      padding: 0 10px;
      outline: 0;
    }

    .search span {
      padding: 0 10px;
      color: var(--muted);
    }

    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.32);
      overflow: hidden;
    }

    .segmented button {
      min-height: 30px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      padding: 0 8px;
      white-space: nowrap;
    }

    .segmented button:last-child { border-right: 0; }
    .segmented button.is-active {
      background: var(--ink);
      color: var(--paper);
    }

    .category-filter {
      grid-auto-flow: row;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-radius: 8px;
    }

    .category-filter button {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .category-filter button:nth-child(3n) {
      border-right: 0;
    }

    .category-filter button:nth-last-child(-n + 3) {
      border-bottom: 0;
    }

    .panel-scroll {
      overflow: auto;
      padding: 12px;
    }

    .current-asset {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(255,255,255,.46);
    }

    .asset-thumb {
      position: relative;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background:
        linear-gradient(135deg, rgba(61,122,98,.18), transparent 50%),
        var(--paper-2);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 19px;
    }

    .asset-thumb img,
    .mini-thumb img {
      display: block;
      width: 88%;
      height: 88%;
      object-fit: contain;
    }

    .asset-thumb::after {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .asset-copy {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .asset-copy strong, .asset-copy span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-copy span { color: var(--muted); }

    .asset-list {
      display: grid;
      gap: 8px;
    }

    .asset-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255,255,255,.32);
      padding: 7px;
      text-align: left;
      width: 100%;
    }

    .asset-row.is-active {
      border-color: var(--accent);
      box-shadow: inset 4px 0 0 var(--accent);
      background: rgba(255,255,255,.56);
    }

    .mini-thumb {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper-2);
      font-family: var(--font-display);
      overflow: hidden;
    }

    .count {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
      background:
        linear-gradient(rgba(251,247,238,.84), rgba(251,247,238,.84)),
        var(--bg);
    }

    .asset-panel {
      position: absolute;
      z-index: 6;
      top: 20px;
      right: 20px;
      bottom: 20px;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      width: 300px;
      min-height: 0;
      padding: 10px;
      overflow: hidden;
      background: rgba(251, 247, 238, .94);
      box-shadow: 0 14px 36px rgba(35, 31, 26, .16);
    }

    .asset-panel .panel-header {
      grid-template-columns: 1fr;
      align-content: start;
      gap: 8px;
      padding: 0;
      border-bottom: 0;
      background: transparent;
    }

    .asset-panel .current-asset {
      min-width: 0;
      margin-bottom: 0;
      padding: 8px;
    }

    .asset-panel .asset-list {
      display: grid;
      min-width: 0;
      gap: 8px;
      min-height: 0;
      align-content: start;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 6px 0 0;
      border-top: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .asset-panel .asset-row {
      grid-template-columns: 34px minmax(0, 1fr) auto;
      min-height: 56px;
    }

    .asset-panel .asset-row .count {
      display: block;
      min-width: 6ch;
      text-align: right;
      white-space: nowrap;
    }

    .asset-panel .mini-thumb {
      width: 32px;
      height: 32px;
    }

    .asset-panel .asset-thumb {
      width: 42px;
      height: 42px;
    }

    .scene-controls {
      position: absolute;
      z-index: 8;
      top: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: 154px minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
      width: 380px;
      padding: 10px;
      border: 1px solid rgba(35,31,26,.18);
      border-radius: 8px;
      background: rgba(251, 247, 238, .96);
      box-shadow: 0 14px 36px rgba(35, 31, 26, .16);
      backdrop-filter: blur(18px);
    }

    .scene-field {
      display: grid;
      min-width: 0;
      gap: 4px;
    }

    .scene-field label,
    .scene-field-caption {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .pokemon-button {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      height: 38px;
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: rgba(255,255,255,.5);
      padding: 4px 8px 4px 4px;
      text-align: left;
    }

    .pokemon-button img,
    .pokemon-option img {
      display: block;
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .pokemon-button span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pokemon-button svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .scene-name-input {
      height: 38px;
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: rgba(255,255,255,.5);
      padding: 0 10px;
    }

    .scene-save {
      height: 38px;
      align-self: end;
    }

    .scene-save-status {
      grid-column: 1 / -1;
      min-height: 14px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .pokemon-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 10px;
      display: grid;
      gap: 8px;
      width: min(300px, calc(100% - 20px));
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(251, 247, 238, .98);
      box-shadow: 0 16px 42px rgba(35, 31, 26, .18);
    }

    .pokemon-popover[hidden] {
      display: none;
    }

    .pokemon-search {
      display: grid;
    }

    .pokemon-search input {
      height: 34px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,.5);
      padding: 0 9px;
    }

    .pokemon-results {
      display: grid;
      gap: 5px;
      max-height: 220px;
      overflow: auto;
      scrollbar-width: thin;
    }

    .pokemon-option {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      padding: 4px 7px;
      text-align: left;
    }

    .pokemon-option:hover,
    .pokemon-option.is-selected {
      border-color: var(--focus);
      background: rgba(65,105,225,.1);
    }

    .canvas-zone {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 168px 320px 20px 360px;
      overflow: auto;
    }

    .canvas-wrap {
      display: grid;
      gap: 12px;
      width: min(100%, 660px, 70vh);
    }

    .canvas {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      aspect-ratio: 1 / 1;
      gap: 6px;
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 10px;
      background:
        linear-gradient(rgba(35,31,26,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35,31,26,.05) 1px, transparent 1px),
        rgba(255,255,255,.34);
      background-size: 24px 24px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.34);
    }

    .cell {
      position: relative;
      display: grid;
      grid-template: 1fr / 1fr;
      place-items: center;
      container-type: inline-size;
      align-self: stretch;
      justify-self: stretch;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      min-width: 0;
      min-height: 0;
      border: 1px dashed rgba(35,31,26,.22);
      border-radius: 7px;
      background: var(--main-area);
      padding: 0;
      overflow: visible;
      cursor: pointer;
    }

    .cell.has-open-dye {
      z-index: 8;
    }

    .cell.outer {
      background:
        repeating-linear-gradient(135deg, rgba(35,31,26,.04) 0 8px, rgba(35,31,26,.08) 8px 9px),
        var(--outer-area);
    }

    .cell.main-boundary {
      border-style: solid;
      border-color: rgba(35,31,26,.42);
    }

    .cell.is-selected {
      border-style: solid;
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 3px rgba(200,95,86,.16);
    }

    .cell:hover {
      border-color: var(--focus);
      box-shadow: inset 0 0 0 2px rgba(65,105,225,.22);
    }

    .coord {
      grid-area: 1 / 1;
      z-index: 0;
      display: grid;
      place-items: center;
      width: 60%;
      height: 60%;
      color: rgba(35,31,26,.4);
      font-family: var(--font-mono);
      font-size: clamp(18px, 34cqw, 34px);
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
    }

    .tile-token {
      grid-area: 1 / 1;
      position: relative;
      z-index: 1;
      align-self: center;
      justify-self: center;
      display: grid;
      place-items: center;
      width: 74%;
      max-width: 74%;
      max-height: 74%;
      aspect-ratio: 1 / .72;
      border: 1px solid rgba(35,31,26,.28);
      border-radius: 6px;
      background:
        linear-gradient(160deg, rgba(255,255,255,.52), transparent 48%),
        var(--paper-2);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(14px, 2.2vw, 22px);
      box-shadow: 0 5px 0 rgba(35,31,26,.09);
    }

    .tile-token img {
      display: block;
      width: 92%;
      height: 92%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .tile-token.green { background-color: #d8ead8; }
    .tile-token.stone { background-color: #d6d4c9; }
    .tile-token.wood { background-color: #e5c79f; }
    .tile-token.wall { background-color: #d9e1e8; }
    .tile-token.roof { background-color: #e7c7c0; }

    .skill-flag {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      display: grid;
      place-items: center;
      min-width: 20px;
      height: 20px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 999px;
      background: var(--skill);
      color: white;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(35,31,26,.2);
      pointer-events: none;
    }

    .orientation-flag {
      position: absolute;
      top: 3px;
      left: 3px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 28px;
      height: 24px;
      color: #3d3444;
      pointer-events: none;
    }

    .orientation-flag svg {
      display: block;
      width: 28px;
      height: 24px;
      overflow: visible;
      filter: drop-shadow(0 2px 4px rgba(35,31,26,.16));
    }

    .orientation-blob {
      fill: rgba(255,255,255,.78);
      stroke: rgba(91,65,104,.42);
      stroke-width: 1.2;
    }

    .orientation-arrow {
      transform: rotate(var(--rotation, 0deg));
      transform-origin: 14px 12px;
    }

    .orientation-arrow path {
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dye-trigger {
      position: absolute;
      left: 5px;
      bottom: 5px;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid rgba(35,31,26,.3);
      border-radius: 999px;
      background: rgba(255,255,255,.76);
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(35,31,26,.14);
      cursor: pointer;
    }

    .dye-trigger svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dye-trigger[data-color] {
      background: var(--dye-color);
      color: #fffdf8;
      border-color: rgba(35,31,26,.24);
    }

    .dye-popover {
      position: absolute;
      left: 5px;
      bottom: 34px;
      z-index: 6;
      display: grid;
      grid-template-columns: repeat(4, 20px);
      gap: 5px;
      padding: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(251,247,238,.98);
      box-shadow: 0 10px 28px rgba(35,31,26,.18);
    }

    .dye-swatch {
      width: 20px;
      height: 20px;
      border: 1px solid rgba(35,31,26,.28);
      border-radius: 999px;
      background: var(--swatch);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.56);
      cursor: pointer;
    }

    .context-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid rgba(200,95,86,.42);
      border-radius: 8px;
      background: rgba(255,255,255,.54);
    }

    .context-info {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .context-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper-2);
      overflow: hidden;
    }

    .context-icon img {
      display: block;
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    .context-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .context-copy strong,
    .context-copy span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-copy span {
      color: var(--muted);
      font-size: 12px;
    }

    .context-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .context-actions button {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,.36);
      padding: 0 9px;
    }

    .layer-strip {
      position: absolute;
      z-index: 5;
      top: 168px;
      left: 20px;
      display: grid;
      gap: 8px;
      width: 238px;
      padding: 10px;
      border: 1px solid rgba(35,31,26,.18);
      border-radius: 8px;
      background: rgba(251, 247, 238, .94);
      box-shadow: 0 14px 36px rgba(35, 31, 26, .14);
      backdrop-filter: blur(18px);
    }

    .layer-strip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .layer-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .layer-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255,255,255,.36);
      padding: 7px;
    }

    .layer-row.is-current {
      border-color: var(--layer);
      box-shadow: inset 4px 0 0 var(--layer);
      background: rgba(255,255,255,.6);
    }

    .layer-row.is-muted {
      opacity: .62;
    }

    .layer-index {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      font-family: var(--font-mono);
      font-weight: 800;
    }

    .layer-name {
      min-width: 0;
    }

    .layer-name strong, .layer-name span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layer-name span {
      color: var(--muted);
      font-size: 12px;
    }

    .tiny-icon {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,.28);
    }

    .inspector-scroll {
      overflow: auto;
    }

    .section {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .asset-title-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .asset-result-count {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      justify-content: flex-end;
      white-space: nowrap;
    }

    .asset-result-number {
      display: inline-block;
      width: 4ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .preference-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .preference-toggle input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
    }

    .preview-card {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.34);
    }

    .mini-preview {
      display: grid;
      gap: 5px;
      min-height: 150px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(255,255,255,.42);
      padding: 10px;
    }

    .inspector-panel {
      position: fixed;
      z-index: 7;
      left: 22px;
      bottom: 22px;
      display: block;
      width: 320px;
      padding: 10px;
    }

    .floating-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .floating-preview-head h2 {
      font-size: 16px;
    }

    .preview-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .preview-pane {
      display: grid;
      gap: 6px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255,255,255,.34);
      padding: 7px;
      overflow: hidden;
    }

    .preview-pane.is-scrollable {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .preview-pane h3 {
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 1.1;
    }

    .front-preview,
    .top-preview {
      --preview-cell-size: 16px;
      display: grid;
      grid-template-columns: repeat(7, var(--preview-cell-size));
      grid-template-rows: repeat(7, var(--preview-cell-size));
      grid-auto-columns: var(--preview-cell-size);
      grid-auto-rows: var(--preview-cell-size);
      justify-content: center;
      align-content: start;
      gap: 3px;
    }

    .preview-scroll {
      max-height: 122px;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .top-preview {
      min-height: calc((var(--preview-cell-size) * 7) + (3px * 6));
    }

    .front-cell,
    .top-cell {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--preview-cell-size);
      height: var(--preview-cell-size);
      aspect-ratio: 1 / 1;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--main-area);
      overflow: hidden;
    }

    .front-cell.outer,
    .top-cell.outer {
      background: var(--outer-area);
    }

    .front-cell.fill,
    .top-cell.fill {
      background: #d8ead8;
    }

    .front-cell.skill,
    .top-cell.skill {
      border-color: var(--skill);
      background: rgba(53,94,201,.14);
    }

    .front-cell img,
    .top-cell img {
      display: block;
      width: 86%;
      height: 86%;
      object-fit: contain;
      pointer-events: none;
    }

    .field-grid {
      display: grid;
      gap: 8px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .value, .field select, .field textarea {
      min-height: 34px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,.38);
      padding: 7px 9px;
    }

    .value.readonly {
      color: var(--muted);
      background: rgba(35,31,26,.04);
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255,255,255,.34);
      padding: 8px 10px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--skill);
    }

    .toggle::after {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      content: "";
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1260px) {
      .workspace {
        grid-template-columns: minmax(600px, 1fr);
      }

      .asset-panel {
        width: 286px;
      }

      .canvas-zone {
        padding-right: 322px;
        padding-left: 270px;
      }
    }

    @media (max-width: 1040px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .save-row {
        justify-content: flex-start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .scene-controls {
        left: 20px;
        right: 20px;
        width: auto;
      }

      .asset-panel {
        top: 96px;
        left: 20px;
        right: 20px;
        bottom: auto;
        width: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        overflow: visible;
      }

      .asset-panel .panel-header {
        grid-template-columns: auto minmax(180px, 1fr) auto;
        align-items: center;
      }

      .asset-panel .asset-list {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .asset-panel .asset-row {
        grid-template-columns: 34px minmax(96px, 1fr);
        flex: 0 0 168px;
      }

      .asset-panel .asset-row .count {
        display: none;
      }

      .canvas-zone {
        padding-top: 244px;
        padding-right: 20px;
        padding-left: 20px;
      }

      .layer-strip {
        top: 244px;
      }
    }

    @media (max-width: 780px) {
      .app {
        grid-template-rows: auto 1fr;
        padding: 8px;
      }

      .topbar {
        grid-template-columns: 1fr;
        align-items: center;
      }

      .save-row {
        display: none;
      }

      .workspace {
        display: grid;
        min-width: 0;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .stage {
        display: grid;
        grid-template-rows: auto auto auto;
        gap: 12px;
        min-height: auto;
        padding: 12px;
        overflow: visible;
      }

      .scene-controls {
        position: static;
        z-index: auto;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 7px;
        width: 100%;
        padding: 8px;
        box-shadow: none;
      }

      .scene-save,
      .scene-save-status {
        display: none;
      }

      .pokemon-button,
      .scene-name-input {
        pointer-events: none;
        background: rgba(255,255,255,.38);
      }

      .pokemon-button svg,
      .pokemon-popover {
        display: none;
      }

      .canvas-zone {
        overflow: visible;
        align-items: center;
        justify-items: center;
        padding: 0;
      }

      .asset-panel {
        display: none;
      }

      .context-bar {
        align-items: center;
      }

      .context-actions {
        display: none;
      }

      .layer-strip {
        position: static;
        z-index: auto;
        width: 100%;
        padding: 10px;
        box-shadow: none;
      }

      .layer-strip-head .secondary-action,
      .layer-row .tiny-icon {
        display: none;
      }

      .canvas-wrap {
        width: 100%;
        max-width: none;
        min-width: 0;
      }

      .canvas {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        justify-self: center;
        width: min(100%, calc(100vw - 64px));
        min-width: 0;
        max-width: 100%;
        gap: 4px;
        padding: 7px;
        max-height: none;
      }

      .cell {
        padding: 0;
        cursor: default;
      }

      .cell:hover {
        border-color: rgba(35,31,26,.42);
        box-shadow: none;
      }

      .cell.is-selected {
        box-shadow: inset 0 0 0 2px var(--accent);
      }

      .tile-token {
        width: 68%;
        font-size: 13px;
      }

      .dye-trigger,
      .dye-popover {
        display: none;
      }

      .inspector-panel {
        position: static;
        width: 100%;
        padding: 10px;
      }

      .preview-scroll {
        max-height: 144px;
      }

    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div class="brand-copy">
          <strong>Pokopia Scene Editor</strong>
        </div>
      </div>

      <div class="save-row">
        <div class="tools" aria-label="编辑工具">
          <button class="tool" title="保存" aria-label="保存">
            <svg viewBox="0 0 24 24"><path d="M4 4h14l2 2v14H4z"/><path d="M8 4v6h8V4"/><path d="M8 20v-7h8v7"/></svg>
          </button>
          <button class="tool is-danger" title="删除" aria-label="删除">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M7 6l1 14h8l1-14"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="stage" aria-label="编辑画布">

          <div class="scene-field">
            <span class="scene-field-caption">Pokemon</span>
            <button class="pokemon-button" id="pokemonButton" type="button" aria-haspopup="listbox" aria-expanded="false">
              <img id="pokemonIcon" src="../../../assets/pokopia_image_sources/pokemon_portraits/213-pikachu.png" alt="" />
              <span id="pokemonName">Pikachu</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 5 3 3 3-3"/></svg>
            </button>
          </div>
          <div class="scene-field">
            <label for="sceneNameInput">Name</label>
            <input class="scene-name-input" id="sceneNameInput" type="text" value="星光庭院" autocomplete="off" />
          </div>
          <button class="secondary-action scene-save" id="sceneSaveAction" type="button">保存</button>
          <div class="scene-save-status" id="sceneSaveStatus" aria-live="polite"></div>

          <div class="pokemon-popover" id="pokemonPopover" hidden>
            <label class="pokemon-search">
              <span class="sr-only">搜索 Pokemon</span>
              <input id="pokemonSearch" type="search" placeholder="输入名字匹配" autocomplete="off" />
            </label>
            <div class="pokemon-results" id="pokemonResults" role="listbox" aria-label="Pokemon 选择"></div>
          </div>
        </div>

        <aside class="panel asset-panel" aria-label="素材选项">
          <div class="panel-header">
            <div class="section-title">
              <h2>素材</h2>
              <div class="asset-title-actions">
                <label class="preference-toggle">
                  <input id="favoriteOnlyFilter" type="checkbox" />
                  <span>只显示喜好</span>
                </label>
                <span class="count asset-result-count" id="assetResultCount">
                  <span class="asset-result-number" id="assetResultNumber">115</span>
                  <span>results</span>
                </span>
              </div>
            </div>
            <label class="search">
              <input type="search" value="围栏" aria-label="搜索素材" />
              <span class="mono">⌕</span>
            </label>
            <div class="segmented category-filter" id="assetCategoryFilter" aria-label="素材分类">
              <button class="is-active" data-category="全部">全部</button>
              <button data-category="家具">家具</button>
              <button data-category="装饰">装饰</button>
              <button data-category="地块">地块</button>
              <button data-category="建筑">建筑</button>
              <button data-category="屋顶">屋顶</button>
            </div>
          </div>

          <div class="current-asset">
            <div class="asset-thumb" aria-hidden="true">
              <img id="currentAssetIcon" src="../../../assets/pokopia_image_sources/item_portraits/0684-wooden-fencing.png" alt="" />
            </div>
            <div class="asset-copy">
              <strong id="currentAsset">白木栅栏</strong>
              <span id="currentAssetMeta">装饰 / 通用 / 可旋转</span>
            </div>
          </div>

          <div class="asset-list" id="assetList">
            <button class="asset-row is-active" data-asset="白木栅栏" data-code="栅" data-item-id="390" data-category="装饰" data-favorite="true" data-meta="装饰 / 通用 / 可旋转" data-icon="../../../assets/pokopia_image_sources/item_portraits/0684-wooden-fencing.png">
                <span class="mini-thumb" aria-hidden="true">
                  <img src="../../../assets/pokopia_image_sources/item_portraits/0684-wooden-fencing.png" alt="" />
                </span>
                <span class="asset-copy">
                  <strong>白木栅栏</strong>
                  <span>装饰 · 通用</span>
                </span>
                <span class="count">No. 390</span>
              </button>
              <button class="asset-row" data-asset="木质长椅" data-code="椅" data-item-id="47" data-category="家具" data-meta="家具 / 休憩 / 可放置" data-icon="../../../assets/pokopia_image_sources/item_portraits/0282-wooden-bench.png">
                <span class="mini-thumb" aria-hidden="true">
                  <img src="../../../assets/pokopia_image_sources/item_portraits/0282-wooden-bench.png" alt="" />
                </span>
                <span class="asset-copy">
                  <strong>木质长椅</strong>
                  <span>家具 · 休憩</span>
                </span>
                <span class="count">No. 47</span>
              </button>
              <button class="asset-row" data-asset="石板路径" data-code="路" data-item-id="717" data-category="地块" data-meta="地块 / 道路 / 主体" data-icon="../../../assets/pokopia_image_sources/item_portraits/0701-stepping-stones.png">
                <span class="mini-thumb" aria-hidden="true">
                  <img src="../../../assets/pokopia_image_sources/item_portraits/0701-stepping-stones.png" alt="" />
                </span>
                <span class="asset-copy">
                  <strong>石板路径</strong>
                  <span>地块 · 道路</span>
                </span>
                <span class="count">No. 717</span>
              </button>
              <button class="asset-row" data-asset="小型灌木" data-code="木" data-item-id="1052" data-category="装饰" data-favorite="true" data-meta="装饰 / 植物 / 通用" data-icon="../../../assets/pokopia_image_sources/item_portraits/0345-leafy-plant.png">
                <span class="mini-thumb" aria-hidden="true">
                  <img src="../../../assets/pokopia_image_sources/item_portraits/0345-leafy-plant.png" alt="" />

                <span class="asset-copy">
                  <strong>小型灌木</strong>
                  <span>装饰 · 植物</span>
                </span>
                <span class="count">No. 1052</span>
              </button>
              <button class="asset-row" data-asset="矮墙边角" data-code="墙" data-item-id="1168" data-category="建筑" data-meta="建筑 / 围墙 / 外围" data-icon="../../../assets/pokopia_image_sources/item_portraits/0756-stone-brick-wall.png">
                <span class="mini-thumb" aria-hidden="true">
                  <img src="../../../assets/pokopia_image_sources/item_portraits/0756-stone-brick-wall.png" alt="" />
                </span>
                <span class="asset-copy">
                  <strong>矮墙边角</strong>
                  <span>建筑 · 围墙</span>
                </span>
                <span class="count">No. 1168</span>

                <span class="mini-thumb" aria-hidden="true">
                  <img src="../../../assets/pokopia_image_sources/item_portraits/0675-brick-roof-decoration.png" alt="" />
                </span>
                <span class="asset-copy">
                  <strong>屋檐片段</strong>
                  <span>屋顶 · L2</span>
                </span>
                <span class="count">No. 1903</span>
            </button>
          </div>
        </aside>

        <div class="canvas-zone">
          <div class="canvas-wrap">
            <div class="canvas" id="canvas" role="grid" aria-label="7x7 布景网格"></div>

            <div class="context-bar">
              <div class="context-info">
                <span class="context-icon" aria-hidden="true">
                  <img id="contextIcon" src="../../../assets/pokopia_image_sources/item_portraits/0684-wooden-fencing.png" alt="" />
                </span>
                <span class="context-copy">
                  <strong id="contextAsset">白木栅栏</strong>
                  <span><span id="contextCell">x3 y2</span> · L1</span>

              <div class="context-actions">

                <button>技能标记</button>
              </div>
            </div>
          </div>
        </div>

        <div class="layer-strip">

          </div>
          <div class="layer-list">
            <div class="layer-row is-muted">

              <span class="tiny-icon" title="未锁定">□</span>

            <div class="layer-row">
              <span class="layer-index">L0</span>
              <span class="layer-name"><strong>地面基础</strong><span>20 instances</span></span>
              <span class="tiny-icon" title="显示">◎</span>
              <span class="tiny-icon" title="锁定">▣</span>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel inspector-panel" aria-label="检查器预览">
        <div class="floating-preview-head">
          <h2>检查器</h2>
        </div>
        <div class="preview-pair">
          <section class="preview-pane is-scrollable">
            <h3>正视图</h3>
            <div class="preview-scroll" aria-label="正视图滚动区域">
              <div class="front-preview" id="frontPreview" aria-label="正视图预览"></div>
            </div>
          </section>
          <section class="preview-pane">
            <h3>俯视图</h3>
            <div class="top-preview" id="topPreview" aria-label="俯视图预览"></div>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const cells = [
      { x: 1, y: 1, code: "路", type: "stone" },
      { x: 2, y: 1, code: "路", type: "stone" },
      { x: 3, y: 1, code: "路", type: "stone" },
      { x: 4, y: 1, code: "木", type: "green", dyeable: true },
      { x: 5, y: 1, code: "木", type: "green", dyeable: true, dyeColor: "#79a95a" },
      { x: 2, y: 2, code: "墙", type: "wall" },
      { x: 3, y: 2, code: "栅", type: "wood", skill: true, skillType: "树叶" },
      { x: 4, y: 2, code: "墙", type: "wall" },
      { x: 1, y: 3, code: "木", type: "green", dyeable: true },
      { x: 3, y: 3, code: "路", type: "stone" },
      { x: 5, y: 3, code: "木", type: "green", skill: true, skillType: "树叶" },
      { x: 2, y: 4, code: "檐", type: "roof", rotation: 90 },
      { x: 3, y: 4, code: "檐", type: "roof", rotation: 180 },
      { x: 4, y: 4, code: "檐", type: "roof", rotation: 270 },
      { x: 0, y: 2, code: "栅", type: "wood", rotation: 90 },
      { x: 6, y: 2, code: "栅", type: "wood", rotation: 270 },
      { x: 0, y: 3, code: "木", type: "green" },
      { x: 6, y: 3, code: "木", type: "green", skill: true, skillType: "储水" }
    ];

    const itemIcons = {
      "栅": "../../../assets/pokopia_image_sources/item_portraits/0684-wooden-fencing.png",
      "椅": "../../../assets/pokopia_image_sources/item_portraits/0282-wooden-bench.png",
      "路": "../../../assets/pokopia_image_sources/item_portraits/0701-stepping-stones.png",
      "木": "../../../assets/pokopia_image_sources/item_portraits/0345-leafy-plant.png",
      "墙": "../../../assets/pokopia_image_sources/item_portraits/0756-stone-brick-wall.png",
      "檐": "../../../assets/pokopia_image_sources/item_portraits/0675-brick-roof-decoration.png"
    };

    const itemNames = {
      "栅": "白木栅栏",
      "椅": "木质长椅",
      "路": "石板路径",
      "木": "小型灌木",
      "墙": "矮墙边角",
      "檐": "屋檐片段"
    };

    const skillLabels = {
      "树叶": "树",
      "耕地": "耕",
      "储水": "水"
    };

    const dyePalette = ["#d96b62", "#e49b3f", "#e2c84b", "#79a95a", "#46a6a0", "#4f7ecf", "#9a71cf", "#d275a6"];

    const pokemonOptions = [
      { name: "Pikachu", slug: "pikachu", aliases: ["pika", "皮卡丘"], icon: "../../../assets/pokopia_image_sources/pokemon_portraits/213-pikachu.png" },
      { name: "Bulbasaur", slug: "bulbasaur", aliases: ["妙蛙种子"], icon: "../../../assets/pokopia_image_sources/pokemon_portraits/026-bulbasaur.png" },
      { name: "Ditto", slug: "ditto", aliases: ["百变怪"], icon: "../../../assets/pokopia_image_sources/pokemon_portraits/063-ditto.png" },
      { name: "Squirtle", slug: "squirtle", aliases: ["杰尼龟"], icon: "../../../assets/pokopia_image_sources/pokemon_portraits/258-squirtle.png" },
      { name: "Eevee", slug: "eevee", aliases: ["伊布"], icon: "../../../assets/pokopia_image_sources/pokemon_portraits/077-eevee.png" },
      { name: "Snorlax", slug: "snorlax", aliases: ["卡比兽"], icon: "../../../assets/pokopia_image_sources/pokemon_portraits/255-snorlax.png" }
    ];

    function readSavedScene() {
      try {
        return JSON.parse(localStorage.getItem("pokopiaSceneEditorDraft")) || {};
      } catch {
        return {};
      }
    }

    const savedScene = readSavedScene();
    const initialPokemon = pokemonOptions.find((pokemon) => pokemon.slug === savedScene.pokemon) || pokemonOptions[0];

    const state = {
      selected: { x: 3, y: 2 },
      assetName: "白木栅栏",
      assetCode: "栅",
      assetIcon: "../../../assets/pokopia_image_sources/item_portraits/0684-wooden-fencing.png",
      assetCategory: "全部",
      favoriteOnly: false,
      openDyeCell: null,
      sceneName: savedScene.name || "星光庭院",
      pokemon: initialPokemon
    };

    const canvas = document.getElementById("canvas");
    const frontPreview = document.getElementById("frontPreview");
    const topPreview = document.getElementById("topPreview");
    const contextCell = document.getElementById("contextCell");
    const contextAsset = document.getElementById("contextAsset");
    const contextIcon = document.getElementById("contextIcon");
    const currentAsset = document.getElementById("currentAsset");
    const currentAssetMeta = document.getElementById("currentAssetMeta");
    const currentAssetIcon = document.getElementById("currentAssetIcon");
    const pokemonButton = document.getElementById("pokemonButton");
    const pokemonIcon = document.getElementById("pokemonIcon");
    const pokemonName = document.getElementById("pokemonName");
    const pokemonPopover = document.getElementById("pokemonPopover");
    const pokemonSearch = document.getElementById("pokemonSearch");
    const pokemonResults = document.getElementById("pokemonResults");
    const sceneNameInput = document.getElementById("sceneNameInput");
    const sceneSaveAction = document.getElementById("sceneSaveAction");
    const sceneSaveStatus = document.getElementById("sceneSaveStatus");
    const favoriteOnlyFilter = document.getElementById("favoriteOnlyFilter");
    const assetResultNumber = document.getElementById("assetResultNumber");
    const readOnlyMedia = window.matchMedia("(max-width: 780px)");

    function isMobileReadOnly() {
      return readOnlyMedia.matches;
    }

    function syncReadOnlyMode() {
      const readOnly = isMobileReadOnly();
      document.documentElement.classList.toggle("is-mobile-readonly", readOnly);
      sceneNameInput.readOnly = readOnly;
      pokemonButton.tabIndex = readOnly ? -1 : 0;
      pokemonButton.setAttribute("aria-disabled", String(readOnly));
      sceneSaveAction.disabled = readOnly;
      if (readOnly) {
        state.openDyeCell = null;
        closePokemonPopover();
      }
    }

    function isOuterCell(x, y) {
      return x === 0 || y === 0 || x === 6 || y === 6;
    }

    function normalizeText(value) {
      return value.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, "");
    }

    function fuzzyMatches(pokemon, query) {
      const normalizedQuery = normalizeText(query);
      if (!normalizedQuery) return true;
      const target = normalizeText(`${pokemon.name} ${pokemon.slug} ${pokemon.aliases.join(" ")}`);
      if (target.includes(normalizedQuery)) return true;

      let queryIndex = 0;
      for (const char of target) {
        if (char === normalizedQuery[queryIndex]) queryIndex += 1;
        if (queryIndex === normalizedQuery.length) return true;
      }
      return false;
    }

    function selectedContextItem() {
      const selectedCell = cells.find((item) => item.x === state.selected.x && item.y === state.selected.y);
      if (selectedCell) {
        return {
          name: itemNames[selectedCell.code] || selectedCell.code,
          icon: itemIcons[selectedCell.code]
        };
      }

      return {
        name: state.assetName,
        icon: state.assetIcon || itemIcons[state.assetCode]
      };
    }

    function applyAssetFilters() {
      const rows = Array.from(document.querySelectorAll(".asset-row"));
      let visibleCount = 0;
      rows.forEach((row) => {
        const matchesCategory = state.assetCategory === "全部" || row.dataset.category === state.assetCategory;
        const matchesFavorite = !state.favoriteOnly || row.dataset.favorite === "true";
        const isVisible = matchesCategory && matchesFavorite;
        row.hidden = !isVisible;
        if (isVisible) visibleCount += 1;
      });
      assetResultNumber.textContent = String(state.favoriteOnly ? visibleCount : 115);
    }

    function selectCell(x, y) {
      if (isMobileReadOnly()) return;
      state.selected = { x, y };
      updateSelection();
      renderCanvas();
    }

    function renderDyeControl(cellData, cellButton) {
      const key = `${cellData.x},${cellData.y}`;
      const trigger = document.createElement("span");
      trigger.className = "dye-trigger";
      trigger.role = "button";
      trigger.tabIndex = 0;
      trigger.title = cellData.dyeColor ? "更换染色" : "选择染色";
      trigger.setAttribute("aria-label", trigger.title);
      if (cellData.dyeColor) {
        trigger.dataset.color = cellData.dyeColor;
        trigger.style.setProperty("--dye-color", cellData.dyeColor);
      }
      trigger.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m4 14 6-6 6 6" />
          <path d="M7 11v7" />
          <path d="M13 11v7" />
          <path d="M5 18h10" />
          <path d="M18 15c1.2 1.2 2 2.3 2 3.4a2 2 0 0 1-4 0c0-1.1.8-2.2 2-3.4z" />
        </svg>
      `;

      trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        state.selected = { x: cellData.x, y: cellData.y };
        state.openDyeCell = state.openDyeCell === key ? null : key;
        updateSelection();
        renderCanvas();
      });

      trigger.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        event.stopPropagation();
        trigger.click();
      });

      cellButton.appendChild(trigger);

      if (state.openDyeCell !== key) return;

      const popover = document.createElement("div");
      popover.className = "dye-popover";
      popover.setAttribute("aria-label", "选择染色");
      popover.addEventListener("click", (event) => event.stopPropagation());

      dyePalette.forEach((color) => {
        const swatch = document.createElement("button");
        swatch.className = "dye-swatch";
        swatch.type = "button";
        swatch.style.setProperty("--swatch", color);
        swatch.title = color;
        swatch.setAttribute("aria-label", `选择颜色 ${color}`);
        swatch.addEventListener("click", (event) => {
          event.stopPropagation();
          cellData.dyeColor = color;
          state.openDyeCell = null;
          renderCanvas();
        });
        popover.appendChild(swatch);
      });

      cellButton.appendChild(popover);
    }

    function setPokemon(pokemon) {
      state.pokemon = pokemon;
      pokemonIcon.src = pokemon.icon;
      pokemonName.textContent = pokemon.name;
      pokemonButton.setAttribute("aria-label", `当前 Pokemon: ${pokemon.name}`);
      renderPokemonResults();
    }

    function renderPokemonResults() {
      const matches = pokemonOptions.filter((pokemon) => fuzzyMatches(pokemon, pokemonSearch.value));
      pokemonResults.innerHTML = "";

      if (!matches.length) {
        const empty = document.createElement("span");
        empty.className = "count";
        empty.textContent = "没有匹配结果";
        pokemonResults.appendChild(empty);
        return;
      }

      matches.forEach((pokemon) => {
        const option = document.createElement("button");
        option.className = "pokemon-option";
        option.type = "button";
        option.role = "option";
        option.setAttribute("aria-selected", String(pokemon.slug === state.pokemon.slug));
        if (pokemon.slug === state.pokemon.slug) option.classList.add("is-selected");
        option.innerHTML = `<img src="${pokemon.icon}" alt="" /><span>${pokemon.name}</span>`;
        option.addEventListener("click", () => {
          setPokemon(pokemon);
          closePokemonPopover();
          sceneSaveStatus.textContent = "未保存";
        });
        pokemonResults.appendChild(option);
      });
    }

    function openPokemonPopover() {
      if (isMobileReadOnly()) return;
      pokemonPopover.hidden = false;
      pokemonButton.setAttribute("aria-expanded", "true");
      pokemonSearch.value = "";
      renderPokemonResults();
      requestAnimationFrame(() => pokemonSearch.focus());
    }

    function closePokemonPopover() {
      pokemonPopover.hidden = true;
      pokemonButton.setAttribute("aria-expanded", "false");
    }

    function saveSceneControls() {
      state.sceneName = sceneNameInput.value.trim() || "未命名场景";
      sceneNameInput.value = state.sceneName;
      try {
        localStorage.setItem("pokopiaSceneEditorDraft", JSON.stringify({
          name: state.sceneName,
          pokemon: state.pokemon.slug
        }));
        sceneSaveStatus.textContent = "已保存";
      } catch {
        sceneSaveStatus.textContent = "保存失败";
      }
    }

    function renderInspectorPreviews() {
      const views = [
        { element: frontPreview, className: "front-cell" },
        { element: topPreview, className: "top-cell" }
      ];

      views.forEach(({ element, className }) => {
        element.innerHTML = "";
        for (let y = 0; y < 7; y += 1) {
          for (let x = 0; x < 7; x += 1) {
            const cellData = cells.find((item) => item.x === x && item.y === y);
            const previewCell = document.createElement("span");
            previewCell.className = className;
            previewCell.setAttribute("aria-label", cellData ? `${x},${y} ${itemNames[cellData.code] || cellData.code}` : `${x},${y}`);
            if (isOuterCell(x, y)) previewCell.classList.add("outer");
            if (cellData) {
              previewCell.classList.add("fill");
              if (cellData.skill) previewCell.classList.add("skill");
              const icon = itemIcons[cellData.code];
              if (icon) {
                const img = document.createElement("img");
                img.src = icon;
                img.alt = "";
                previewCell.appendChild(img);
              }
            }
            element.appendChild(previewCell);
          }
        }
      });
    }

    function renderCanvas() {
      canvas.innerHTML = "";
      for (let y = 0; y < 7; y += 1) {
        for (let x = 0; x < 7; x += 1) {
          const cellData = cells.find((item) => item.x === x && item.y === y);
          const cellKey = `${x},${y}`;
          const button = document.createElement("div");
          button.className = "cell";
          button.setAttribute("role", "gridcell");
          button.tabIndex = isMobileReadOnly() ? -1 : 0;
          button.dataset.x = String(x);
          button.dataset.y = String(y);
          button.setAttribute("aria-label", `${x},${y}`);
          if (isOuterCell(x, y)) button.classList.add("outer");
          if (x >= 1 && x <= 5 && y >= 1 && y <= 5) button.classList.add("main-boundary");
          if (state.selected.x === x && state.selected.y === y) button.classList.add("is-selected");
          if (state.openDyeCell === cellKey) button.classList.add("has-open-dye");

          button.innerHTML = `<span class="coord">${x},${y}</span>`;
          if (cellData) {
            const token = document.createElement("span");
            token.className = `tile-token ${cellData.type}`;
            const icon = itemIcons[cellData.code];
            if (icon) {
              token.innerHTML = `<img src="${icon}" alt="" /><span class="sr-only">${cellData.code}</span>`;
            } else {
              token.textContent = cellData.code;
            }
            button.appendChild(token);
            if (cellData.skill) {
              const flag = document.createElement("span");
              flag.className = "skill-flag";
              const skillType = cellData.skillType || "技能";
              flag.textContent = skillLabels[skillType] || skillType.slice(0, 1);
              flag.title = skillType;
              flag.setAttribute("aria-label", skillType);
              button.appendChild(flag);
            }
            if ([90, 180, 270].includes(cellData.rotation)) {
              const orientation = document.createElement("span");
              orientation.className = "orientation-flag";
              orientation.title = `旋转 ${cellData.rotation} 度`;
              orientation.setAttribute("aria-label", `旋转 ${cellData.rotation} 度`);
              orientation.innerHTML = `
                <svg viewBox="0 0 28 24" aria-hidden="true">
                  <path class="orientation-blob" d="M4.4 13.1C2.7 8.4 5.4 4.3 10.1 4.6c1.4-2.4 5.2-2.3 6.4.1 4.2-.4 7.6 3.1 6.6 7.5 1.8 2.7-.1 6.3-3.6 6.5-2.6 2.4-7.1 2.2-9.2-.2-3.6.7-6.9-2-5.9-5.4Z" />
                  <g class="orientation-arrow" style="--rotation:${cellData.rotation}deg">
                    <path d="M14 17.5v-11" />
                    <path d="m9.7 10.8 4.3-4.3 4.3 4.3" />
                  </g>
                </svg>
              `;
              button.appendChild(orientation);
            }
            if (cellData.dyeable && !isMobileReadOnly()) renderDyeControl(cellData, button);
          }

          if (!isMobileReadOnly()) {
            button.addEventListener("click", () => {
              state.openDyeCell = null;
              selectCell(x, y);
            });

            button.addEventListener("keydown", (event) => {
              if (event.key !== "Enter" && event.key !== " ") return;
              event.preventDefault();
              state.openDyeCell = null;
              selectCell(x, y);
            });
          }
          canvas.appendChild(button);
        }
      }
      renderInspectorPreviews();
    }

    function updateSelection() {
      const { x, y } = state.selected;
      const item = selectedContextItem();
      contextAsset.textContent = item.name;
      contextIcon.src = item.icon || "";
      contextIcon.hidden = !item.icon;
      contextCell.textContent = `x${x} y${y}`;
    }

    sceneNameInput.value = state.sceneName;
    setPokemon(state.pokemon);
    syncReadOnlyMode();

    readOnlyMedia.addEventListener("change", () => {
      syncReadOnlyMode();
      renderCanvas();
    });

    pokemonButton.addEventListener("click", (event) => {
      if (isMobileReadOnly()) return;
      event.stopPropagation();
      if (pokemonPopover.hidden) {
        openPokemonPopover();
      } else {
        closePokemonPopover();
      }
    });

    pokemonSearch.addEventListener("input", renderPokemonResults);

    sceneNameInput.addEventListener("input", () => {
      if (isMobileReadOnly()) return;
      sceneSaveStatus.textContent = "未保存";
    });

    sceneNameInput.addEventListener("keydown", (event) => {
      if (isMobileReadOnly()) return;
      if (event.key === "Enter") {
        saveSceneControls();
        sceneNameInput.blur();
      }
    });

    sceneSaveAction.addEventListener("click", saveSceneControls);

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".scene-controls")) closePokemonPopover();
      if (!event.target.closest(".dye-popover, .dye-trigger") && state.openDyeCell) {
        state.openDyeCell = null;
        renderCanvas();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePokemonPopover();
    });

    document.getElementById("assetCategoryFilter").addEventListener("click", (event) => {
      if (isMobileReadOnly()) return;
      const button = event.target.closest("button");
      if (!button) return;
      state.assetCategory = button.dataset.category;
      document.querySelectorAll("#assetCategoryFilter button").forEach((item) => item.classList.remove("is-active"));
      button.classList.add("is-active");
      applyAssetFilters();
    });

    favoriteOnlyFilter.addEventListener("change", () => {
      if (isMobileReadOnly()) return;
      state.favoriteOnly = favoriteOnlyFilter.checked;
      applyAssetFilters();
    });

    document.getElementById("assetList").addEventListener("click", (event) => {
      if (isMobileReadOnly()) return;
      const row = event.target.closest(".asset-row");
      if (!row) return;
      document.querySelectorAll(".asset-row").forEach((item) => item.classList.remove("is-active"));
      row.classList.add("is-active");
      state.assetName = row.dataset.asset;
      state.assetCode = row.dataset.code;
      state.assetIcon = row.dataset.icon;
      currentAsset.textContent = state.assetName;
      currentAssetMeta.textContent = row.dataset.meta;
      currentAssetIcon.src = state.assetIcon;
      updateSelection();
      renderCanvas();
    });

    renderCanvas();
    updateSelection();
    applyAssetFilters();
  </script>
</body>
</html>
